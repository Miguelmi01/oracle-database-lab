services:
  oracle:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: oracle-db
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PWD=${ORACLE_PASSWORD:-CHANGE_ME}
    volumes:
      - oracledata:/opt/oracle/oradata

volumes:
  oracledata:
